workflows:
  ios-release:
    name: Moto iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Needed for the TestFlight/App Store upload step in `publishing` below —
      # unrelated to signing itself. Reuses Wingman's existing key (same
      # Apple Developer account/team) rather than re-uploading a duplicate —
      # Apple only lets you download a given API key's .p8 file once, and
      # this one no longer had a saved copy handy.
      app_store_connect: wingman_asc_api_key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        # Distribution certificates are reusable across apps on the same
        # Apple Developer team, so this reuses Wingman's rather than
        # generating a new one. Provisioning profiles are per-bundle-ID
        # though - moto_appstore_profile must be created fresh for
        # com.rachoucorp.moto (Wingman's won't work here).
        certificates:
          - wingman_distribution_cert
        provisioning_profiles:
          - moto_appstore_profile
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install

      - name: Build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
