workflows:
  ios-release:
    name: Moto iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Needed for the TestFlight/App Store upload step in `publishing` below —
      # unrelated to signing itself.
      app_store_connect: moto_asc_api_key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        # Automatic signing (distribution_type + bundle_identifier) failed for
        # Wingman on this same Apple Developer account/team ("No matching
        # profiles found", even with an Admin-role key) — root cause was never
        # identified. Try automatic signing first for a fresh app record; if
        # it fails the same way, fall back to manual signing like Wingman:
        # generate a CSR, create an Apple Distribution cert + App Store
        # provisioning profile for com.rachoucorp.moto manually at
        # developer.apple.com, then upload both under Codemagic Team settings
        # -> Code signing identities with the reference names below.
        certificates:
          - moto_distribution_cert
        provisioning_profiles:
          - moto_appstore_profile
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install

      - name: Build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
